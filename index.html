<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>근무표</title>
<style>
  :root { --line:#d9e0e7; --head:#f1f5f9; --blue:#2563eb; --text:#243041; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:Arial,"Malgun Gothic",sans-serif; color:var(--text); background:#f7f9fc; }
  .app { max-width:1500px; margin:0 auto; padding:22px; }
  header { display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:18px; }
  h1 { font-size:25px; margin:0 0 5px; }
  .subtitle { font-size:13px; color:#687789; }
  .controls { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  button, input, select { font:inherit; }
  button { border:1px solid #cbd5e1; background:white; border-radius:7px; padding:9px 12px; cursor:pointer; }
  button.primary { background:var(--blue); color:white; border-color:var(--blue); }
  button:hover { filter:brightness(.97); }
  input[type="month"], input[type="text"], input[type="date"], select { border:1px solid #cbd5e1; border-radius:7px; padding:9px; background:white; }
  .notice { background:#eff6ff; border:1px solid #bfdbfe; color:#1e40af; border-radius:8px; padding:10px 12px; font-size:13px; margin-bottom:14px; }
  .table-wrap { height:calc(100vh - 150px); min-height:420px; overflow:auto; border:1px solid var(--line); border-radius:10px; background:white; box-shadow:0 3px 12px #0f172a0a; }
  table { border-collapse:separate; border-spacing:0; width:100%; min-width:900px; table-layout:fixed; }
  th, td { border-right:1px solid var(--line); border-bottom:1px solid var(--line); }
  th:last-child, td:last-child { border-right:0; }
  tr:last-child td { border-bottom:0; }
  thead th { background:var(--head); padding:11px 8px; font-size:13px; text-align:center; position:sticky; top:0; z-index:2; }
  th.date-col { width:150px; }
  th.day-col { width:42px; }
  th.person-col { width:190px; }
  tbody td { height:76px; padding:6px; vertical-align:top; }
  tbody tr.month-row td { height:auto; padding:8px 12px; background:#e8eefc; color:#1e3a8a; font-weight:700; font-size:14px; border-right:0; }
  tbody tr.month-row td span { position:sticky; left:12px; display:inline-block; }
  td.date-cell { background:#f8fafc; padding:9px; font-size:13px; }
  .date-num { font-weight:700; font-size:15px; }
  .weekday { color:#64748b; margin-left:4px; }
  .weekend-sun .date-num, .weekend-sun .weekday { color:#dc2626; }
  .weekend-sat .date-num, .weekend-sat .weekday { color:#2563eb; }
  .today { box-shadow:inset 0 0 0 2px #60a5fa; }
  td.date-cell.holiday { background:#fef2f2; }
  td.date-cell.holiday .date-num, td.date-cell.holiday .weekday { color:#dc2626; }
  .holiday-name { display:block; font-size:10px; color:#dc2626; font-weight:700; margin-top:2px; white-space:nowrap; }
  .shift-tag { display:inline-block; margin-left:6px; padding:1px 6px; border-radius:9px; font-size:11px; font-weight:700; vertical-align:middle; }
  .shift-a { background:#dbeafe; color:#1d4ed8; }
  .shift-b { background:#fef9c3; color:#a16207; }
  .shift-c { background:#ede9fe; color:#6d28d9; }
  .shift-off { background:#f1f5f9; color:#64748b; }
  td.person-cell { padding:5px; }
  .entry { width:100%; height:100%; min-height:62px; resize:vertical; border:1px solid transparent; border-radius:5px; padding:7px; font-size:13px; line-height:1.4; background:transparent; color:var(--text); }
  .entry:focus { outline:2px solid #93c5fd; border-color:#93c5fd; background:#fff; }
  .entry::placeholder { color:#b0bac7; }
  .bottom { display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; margin-top:12px; font-size:12px; color:#64748b; }
  .legend { display:flex; gap:12px; flex-wrap:wrap; }
  .dot { display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:5px; }
  .empty { text-align:center; padding:30px; color:#64748b; }
  .locked-entry { background:#f1f5f9 !important; color:#64748b; cursor:not-allowed; }
  .admin-badge { font-size:12px; padding:7px 10px; border-radius:7px; background:#ecfdf5; color:#047857; border:1px solid #a7f3d0; }
  .admin-badge.viewer { background:#fff7ed; color:#9a3412; border-color:#fed7aa; }
  td.modified-cell { white-space:pre-line; font-size:11px; line-height:1.45; cursor:default; }
  td.modified-cell.has-memo { cursor:help; }
  td.modified-cell.has-memo::after { content:''; position:absolute; right:0; top:0; width:0; height:0; border-top:9px solid #dc2626; border-left:9px solid transparent; pointer-events:none; }
  td.modified-cell:focus { outline:2px solid #93c5fd; outline-offset:-2px; }
  #memoPop { position:fixed; display:none; z-index:50; min-width:230px; max-width:360px; background:#ffffe1; border:1px solid #000; padding:6px 8px; font:12px/1.45 "Malgun Gothic",Arial,sans-serif; color:#000; box-shadow:3px 3px 6px #0004; pointer-events:none; }
  #memoPop .memo-title { font-weight:700; margin-bottom:5px; padding-bottom:3px; border-bottom:1px solid #c9c9a0; }
  #memoPop .memo-item { margin:0 0 5px; }
  #memoPop .memo-item:last-child { margin-bottom:0; }
  #memoPop .memo-meta { font-weight:700; }
  #memoPop .memo-body { padding-left:8px; white-space:pre-wrap; overflow-wrap:anywhere; }
  .note-cell { position:relative; }
  .note-cell::after { content:''; position:absolute; right:0; top:0; width:0; height:0; border-top:9px solid #f59e0b; border-left:9px solid transparent; pointer-events:none; }
  .small-note { color:#64748b; font-size:12px; margin-top:8px; }
  .account-list { width:100%; border-collapse:collapse; min-width:0; }
  .account-list th,.account-list td { padding:8px; border:1px solid var(--line); text-align:left; font-size:13px; }
  .account-list th { background:var(--head); }
  .modal-backdrop { position:fixed; inset:0; background:#0f172a66; display:none; align-items:center; justify-content:center; padding:16px; z-index:10; }
  .modal { width:min(460px,100%); background:white; border-radius:12px; padding:20px; box-shadow:0 20px 50px #0003; }
  .modal h2 { margin:0 0 14px; font-size:19px; }
  .form-row { display:grid; gap:6px; margin:12px 0; font-size:13px; }
  .modal-actions { display:flex; justify-content:flex-end; gap:8px; margin-top:18px; }
  @media(max-width:700px) { .app{padding:12px} h1{font-size:21px} th.person-col{width:150px} }
</style>
</head>
<body>
<div class="app">
  <header>
    <div>
      <h1>📅 근무표</h1>
      <div class="subtitle">엑셀처럼 날짜별 일정을 한눈에 확인하세요. (2026년 ~ 2028년)</div>
    </div>
    <div class="controls">
      <button id="todayBtn" class="primary">오늘</button>
      <input type="month" id="monthPicker" aria-label="월 선택">
      <span id="loginStatus" class="admin-badge viewer">로그인 필요</span>
      <button id="loginBtn">로그인</button>
      <button id="logoutBtn" hidden>로그아웃</button>
      <button id="manageAccountsBtn" hidden>계정 관리</button>
      <button id="managePeople">항목 관리</button>
    </div>
  </header>

  <div class="table-wrap">
    <table id="schedule">
      <thead><tr id="headerRow"></tr></thead>
      <tbody id="bodyRows"></tbody>
    </table>
  </div>
  <div class="bottom">
    <div class="legend">
      <span><i class="dot" style="background:#dc2626"></i>일요일</span>
      <span><i class="dot" style="background:#2563eb"></i>토요일</span>
      <span><i class="dot" style="background:#60a5fa"></i>오늘</span>
    </div>
    <span id="saveStatus">자동 저장 대기 중</span>
  </div>
</div>

<div id="memoPop" role="tooltip"></div>

<div class="modal-backdrop" id="peopleModal">
  <div class="modal">
    <h2>친구 관리</h2>
    <p style="font-size:13px;color:#64748b">표에 표시할 친구 이름을 쉼표로 구분해 입력하세요. 예: 민수, 지영, 나</p>
    <label class="form-row">친구 이름 목록
      <input type="text" id="peopleInput" placeholder="민수, 지영, 나">
    </label>
    <div class="modal-actions">
      <button id="cancelPeople">취소</button>
      <button class="primary" id="savePeople">저장</button>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="accountsModal">
  <div class="modal" style="width:min(650px,100%)">
    <h2>계정 관리 <span style="font-size:12px;color:#64748b;font-weight:normal">관리자 전용</span></h2>
    <form id="accountForm">
      <label class="form-row">사용자 아이디
        <input type="text" id="newUsername" autocomplete="off" required maxlength="40" placeholder="예: kim 또는 김철수">
      </label>
      <label class="form-row">비밀번호
        <input type="password" id="newPassword" autocomplete="new-password" required minlength="4" maxlength="100" placeholder="4자 이상">
      </label>
      <label class="form-row">권한
        <select id="newRole"><option value="user">일반 사용자</option><option value="admin">관리자</option></select>
      </label>
      <div class="modal-actions" style="justify-content:space-between">
        <button type="submit" class="primary">계정 등록</button>
        <button type="button" id="closeAccounts">닫기</button>
      </div>
    </form>
    <hr style="border:0;border-top:1px solid #e2e8f0;margin:16px 0">
    <div id="accountsTableWrap"></div>
    <div class="small-note">계정 삭제는 해당 행의 삭제 버튼을 누르세요. 현재 로그인한 관리자 계정은 삭제할 수 없습니다.</div>
  </div>
</div>

<script>
(() => {
  const STORAGE_KEY = 'friendScheduleV1';
  // ===== Firebase 실시간 동기화 설정: 아래 firebaseConfig만 교체하면 작동 =====
  const firebaseConfig = {
    apiKey: "AIzaSyBh5_5nvMBaiOaf4vuze0HNfUUVSkKdG-I",
    authDomain: "shift-schedule-bdf92.firebaseapp.com",
    databaseURL: "https://shift-schedule-bdf92-default-rtdb.firebaseio.com",
    projectId: "shift-schedule-bdf92",
    storageBucket: "shift-schedule-bdf92.firebasestorage.app",
    messagingSenderId: "337621972785",
    appId: "1:337621972785:web:36f87d7e1b4577681ee210"
  };
  const SYNC_ENABLED = !firebaseConfig.apiKey.includes('여기에'); // 설정 넣으면 true
  const DB_PATH = 'schedule/main'; // 데이터 저장 위치
  let applyingRemote = false; // 원격 적용 중 저장 방지
  let db = null;

  if (!localStorage.getItem('friendScheduleResetV4')) {
    localStorage.removeItem(STORAGE_KEY);
    localStorage.removeItem('friendScheduleAccounts');
    sessionStorage.removeItem('friendScheduleUser');
    localStorage.setItem('friendScheduleResetV4', '1');
  }
  const DEFAULT_PEOPLE = ['휴가자1', '휴가자2', '휴가자3', '휴가자4', 'Remark1', 'Remark2'];
  let data = loadData();
  let currentMonth = new Date();
  currentMonth = new Date(currentMonth.getFullYear(), currentMonth.getMonth(), 1);
  let currentUser = sessionStorage.getItem('friendScheduleUser') || '';
  const DEFAULT_ADMIN = { username: 'admin', password: 'admin', role: 'admin' };
  let accounts = loadAccounts();
  // 기존 저장된 admin 계정의 비밀번호를 새 기본값으로 갱신 (사용자가 계정 관리에서 바꾸지 않은 경우만)
  {
    const adm = accounts.find(a => a.username === 'admin');
    if (adm && (adm.password === 'admin1234')) adm.password = 'admin';
    saveAccounts();
  }
  let isAdmin = false;
  if (currentUser && !accounts.some(a => a.username === currentUser)) {
    currentUser = '';
    sessionStorage.removeItem('friendScheduleUser');
  }

  function loadAccounts() {
    try {
      const saved = JSON.parse(localStorage.getItem('friendScheduleAccounts'));
      if (Array.isArray(saved) && saved.some(a => a.username === 'admin' && a.role === 'admin')) return saved;
    } catch (e) {}
    const initial = [DEFAULT_ADMIN];
    localStorage.setItem('friendScheduleAccounts', JSON.stringify(initial));
    return initial;
  }
  function saveAccounts() {
    localStorage.setItem('friendScheduleAccounts', JSON.stringify(accounts));
  }
  function getCurrentAccount() {
    return accounts.find(a => a.username === currentUser) || null;
  }
  function startOfDay(d) {
    return new Date(d.getFullYear(), d.getMonth(), d.getDate());
  }
  function isOlderThanSevenDays(dateString) {
    const parts = dateString.split('-').map(Number);
    const rowDate = new Date(parts[0], parts[1]-1, parts[2]);
    const cutoff = new Date();
    cutoff.setDate(cutoff.getDate() - 7);
    return startOfDay(rowDate) < startOfDay(cutoff);
  }
  function updateAdminUI() {
    const account = getCurrentAccount();
    isAdmin = !!account && account.role === 'admin';
    const loginStatus = document.getElementById('loginStatus');
    loginStatus.textContent = account
      ? `${account.username} · ${isAdmin ? '관리자' : '일반 사용자'}`
      : '로그인 필요';
    loginStatus.classList.toggle('viewer', !isAdmin);
    document.getElementById('loginBtn').hidden = !!account;
    document.getElementById('logoutBtn').hidden = !account;
    document.getElementById('manageAccountsBtn').hidden = !isAdmin;
    document.getElementById('managePeople').hidden = !isAdmin;
  }

  function recordHistory(date, person, value, before) {
    if (!Array.isArray(data.history)) data.history = [];
    const now = new Date();
    data.history.push({
      date,
      category: person,
      user: currentUser || (isAdmin ? '관리자' : '사용자'),
      time: now.toLocaleString('ko-KR', {year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}),
      timestamp: now.toISOString(),
      before: before ? String(before).replace(/\s+/g, ' ').slice(0, 40) : '',
      summary: value ? String(value).replace(/\s+/g, ' ').slice(0, 70) : '일정 삭제'
    });
    const sameDate = data.history.filter(h => h.date === date);
    if (sameDate.length > 10) {
      const drop = new Set(sameDate.slice(0, sameDate.length - 10));
      data.history = data.history.filter(h => !drop.has(h));
    }
    data.history = data.history.slice(-2000);
  }

  const memoPop = document.getElementById('memoPop');
  function buildMemoHtml(date) {
    const items = (Array.isArray(data.history) ? data.history : [])
      .filter(h => h.date === date).slice(-10).reverse();
    const title = `<div class="memo-title">${escapeHtml(date)} 최근 수정 내역 (최신순 · 최대 10건)</div>`;
    if (!items.length) {
      const stamp = data.modified && data.modified[date];
      if (!stamp) return '';
      const who = data.modifiedBy && data.modifiedBy[date];
      return title + `<div class="memo-item"><div class="memo-meta">${escapeHtml(who || '이전 기록')} · ${escapeHtml(formatModified(stamp))}</div><div class="memo-body">상세 내역이 없는 이전 기록입니다.</div></div>`;
    }
    return title + items.map(h => {
      const change = h.before ? `${h.before} → ${h.summary || ''}` : (h.summary || '일정 수정');
      return `<div class="memo-item"><div class="memo-meta">${escapeHtml(h.user || '알 수 없음')} · ${escapeHtml(h.time || '')}</div><div class="memo-body">${escapeHtml(h.category || '')}: ${escapeHtml(change)}</div></div>`;
    }).join('');
  }
  function showMemo(anchor, date) {
    const html = buildMemoHtml(date);
    if (!html) return;
    memoPop.innerHTML = html;
    memoPop.style.display = 'block';
    const r = anchor.getBoundingClientRect();
    const w = memoPop.offsetWidth, h = memoPop.offsetHeight;
    let left = r.left - w - 6;
    if (left < 8) left = Math.min(r.right + 6, window.innerWidth - w - 8);
    const top = Math.min(Math.max(8, r.top), window.innerHeight - h - 8);
    memoPop.style.left = Math.max(8, left) + 'px';
    memoPop.style.top = Math.max(8, top) + 'px';
  }
  function hideMemo() { memoPop.style.display = 'none'; }
  window.addEventListener('scroll', hideMemo, true);

  function loadData() {
    try {
      const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
      if (saved && Array.isArray(saved.people) && saved.events) {
        if (!saved.modified) saved.modified = {};
        if (!saved.modifiedBy) saved.modifiedBy = {};
        if (!saved.cellModified) saved.cellModified = {};
        if (!saved.cellModifiedBy) saved.cellModifiedBy = {};
        if (!Array.isArray(saved.history)) saved.history = [];
        const oldDefaults = ['휴가자', '경조사', '기타', 'Remark'];
        if (saved.people.length === oldDefaults.length && oldDefaults.every((p, i) => saved.people[i] === p)) {
          saved.people = [...DEFAULT_PEOPLE];
        }
        return saved;
      }
    } catch (e) {}
    return { people: [...DEFAULT_PEOPLE], events: {}, modified: {}, modifiedBy: {}, cellModified: {}, cellModifiedBy: {}, history: [] };
  }
  // 서버/로컬에서 온 데이터를 항상 올바른 형태로 강제 정규화 (Firebase가 배열을 객체로 바꾸는 등의 문제 방지)
  function normalizeData(d) {
    if (!d || typeof d !== 'object' || Array.isArray(d)) d = {};
    if (!Array.isArray(d.people)) {
      d.people = (d.people && typeof d.people === 'object')
        ? Object.keys(d.people).sort((a, b) => Number(a) - Number(b)).map(k => d.people[k]).filter(p => typeof p === 'string' && p.trim())
        : [];
    }
    d.people = d.people.filter(p => typeof p === 'string' && p.trim());
    if (!d.people.length) d.people = [...DEFAULT_PEOPLE];
    for (const k of ['events', 'modified', 'modifiedBy', 'cellModified', 'cellModifiedBy']) {
      if (!d[k] || typeof d[k] !== 'object' || Array.isArray(d[k])) d[k] = {};
    }
    if (!Array.isArray(d.history)) {
      d.history = (d.history && typeof d.history === 'object')
        ? Object.keys(d.history).sort((a, b) => Number(a) - Number(b)).map(k => d.history[k]).filter(Boolean)
        : [];
    }
    return d;
  }
  // 입력 중에는 저장을 모아서 처리(디바운스) — 글자마다 전체 JSON 저장으로 인한 타이핑 지연 제거
  let persistTimer = null;
  function persistSoon(delay) {
    clearTimeout(persistTimer);
    persistTimer = setTimeout(persist, delay || 400);
  }
  function persist() {
    clearTimeout(persistTimer);
    persistTimer = null;
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    document.getElementById('saveStatus').textContent =
      '저장됨 · ' + new Date().toLocaleTimeString('ko-KR', {hour:'2-digit', minute:'2-digit'});
    if (SYNC_ENABLED) pushToServer();
  }

  // ===== Firebase 실시간 동기화 =====
  async function initFirebase() {
    if (!SYNC_ENABLED) return;
    try {
      // Firebase compat SDK를 필요할 때 동적으로 로드
      if (!window.firebase) {
        await new Promise((resolve, reject) => {
          const s1 = document.createElement('script');
          s1.src = 'https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js';
          s1.onload = resolve; s1.onerror = reject;
          document.head.appendChild(s1);
        });
        await new Promise((resolve, reject) => {
          const s2 = document.createElement('script');
          s2.src = 'https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js';
          s2.onload = resolve; s2.onerror = reject;
          document.head.appendChild(s2);
        });
      }
      firebase.initializeApp(firebaseConfig);
      db = firebase.database();

      // 서버에 데이터가 없으면(첫 실행) 현재 브라우저 데이터를 올린다
      const snap = await db.ref(DB_PATH).get();
      if (!snap.exists()) {
        await db.ref(DB_PATH).set(JSON.parse(JSON.stringify(data)));
      } else {
        // 서버 데이터가 기준 — 정규화 후 적용
        applyingRemote = true;
        data = normalizeData(snap.val());
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        render();
        applyingRemote = false;
      }

      // 실시간 리스너: 다른 사람이 수정하면 즉시 반영
      db.ref(DB_PATH).on('value', snapshot => {
        if (applyingRemote) return;
        const remote = snapshot.val();
        if (!remote) return;
        if (JSON.stringify(data) === JSON.stringify(remote)) return; // 자기 수정은 무시
        // 편집 중(포커스 있는 textarea)이면 지금은 화면을 다시 그리지 않는다 — 입력 보호 + 스크롤 고정
        const ae = document.activeElement;
        if (ae && ae.closest && ae.closest('textarea.entry')) return;
        applyingRemote = true;
        data = normalizeData(remote);
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        // 현재 보이는 첫 날짜를 기억했다가 다시 그린 뒤 그 위치로 복원 (스크롤 흔들림 방지)
        const wrap = document.querySelector('.table-wrap');
        const headH = wrap.querySelector('thead').offsetHeight;
        const wTop = wrap.getBoundingClientRect().top + headH;
        let anchorDate = null;

      });

    } catch (err) {

  async function pushToServer() {
    if (!SYNC_ENABLED || !db || applyingRemote) return;

    try {
      await db.ref(DB_PATH).set(JSON.parse(JSON.stringify(data)));

    } catch (err) {
      document.getElementById('saveStatus').textContent = '서버 저장 실패 (오프라인 저장됨)';
    }
  }
  initFirebase();
  function keyFor(date, person) {
    return `${date}|${person}`;
  }
  function fmtDate(y, m, d) {
    return `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
  }
  const RANGE_START = 2026, RANGE_END = 2028;
  // ===== 4조 3교대 6일 순환 (2조 기준 표기) =====
  // A=오전, B=오후, C=야간, 휴=휴무. 6일 근무 후 2일 휴무, 24일 주기.
  // 2조 기준: 2026-10-24~29 A조(오전) → 휴무 2일 → 11/1~6 B조(오후) → 휴무 2일 → 11/9~14 C조(야간) → ...
  const SHIFT_ANCHOR = new Date(2026, 9, 24);
  const SHIFT_CYCLE = [
    { label: 'A조', desc: '오전', days: 6 },
    { label: '휴무', desc: '', days: 2 },
    { label: 'B조', desc: '오후', days: 6 },
    { label: '휴무', desc: '', days: 2 },
    { label: 'C조', desc: '야간', days: 6 },
    { label: '휴무', desc: '', days: 2 }
  ];
  function shiftOf(y, m, d) {
    const cur = new Date(y, m, d);
    const diff = Math.floor((cur - SHIFT_ANCHOR) / 86400000);
    let phase = ((diff % 24) + 24) % 24;
    for (const seg of SHIFT_CYCLE) {
      if (phase < seg.days) return seg;
      phase -= seg.days;
    }
    return SHIFT_CYCLE[0];
  }
  // ===== 공휴일 (대한민국, 2026~2028) =====
  const HOLIDAYS = {

    '2026-07-17': '제헌절', '2026-08-17': '광복절', '2026-09-24': '추석', '2026-09-25': '추석',
    '2026-09-26': '추석', '2026-10-05': '개천절', '2026-10-09': '한글날', '2026-12-25': '크리스마스',
    '2027-01-01': '새해', '2027-02-06': '설날', '2027-02-08': '설날', '2027-02-09': '설날',
    '2027-03-01': '3·1절', '2027-05-03': '노동절', '2027-05-05': '어린이날',
    '2027-05-13': '부처님 오신 날', '2027-06-06': '현충일', '2027-07-19': '제헌절',
    '2027-08-16': '광복절', '2027-09-14': '추석', '2027-09-15': '추석', '2027-09-16': '추석',
    '2027-10-04': '개천절', '2027-10-11': '한글날', '2027-12-25': '크리스마스',
    '2028-01-01': '새해', '2028-01-26': '설날', '2028-01-27': '설날', '2028-01-28': '설날',
    '2028-03-01': '3·1절', '2028-05-01': '노동절', '2028-05-02': '부처님 오신 날',
    '2028-05-05': '어린이날', '2028-06-06': '현충일', '2028-07-17': '제헌절', '2028-08-15': '광복절',
    '2028-10-02': '추석', '2028-10-03': '개천절·추석', '2028-10-04': '추석', '2028-10-09': '한글날',
    '2028-12-25': '크리스마스'
  };
  const MONTH_COUNT = (RANGE_END - RANGE_START + 1) * 12;
  const WEEKDAYS = ['일','월','화','수','목','금','토'];

  // ===== 가상 렌더링: 월 단위로 필요한 만큼만 DOM에 붙였다 뗀다 =====
  let monthRowEls = [];   // 60개 월 구분행 (가벼움, 항상 존재)
  let loaded = new Set(); // 일 행이 붙어 있는 월 인덱스
  function indexOfMonth(y, m) { return (y - RANGE_START) * 12 + m; }
  function ymOfIndex(idx) { return { y: RANGE_START + Math.floor(idx / 12), m: idx % 12 }; }

  function buildMonthDayRows(y, m) {
    const now = new Date();
    const ty = now.getFullYear(), tm = now.getMonth(), tdd = now.getDate();
    const cut = new Date(now); cut.setDate(cut.getDate() - 7);
    const cutoffStr = fmtDate(cut.getFullYear(), cut.getMonth(), cut.getDate());
    const histDates = new Set((data.history || []).map(h => h.date));
    const rows = [];
    const days = new Date(y, m+1, 0).getDate();
    for (let d = 1; d <= days; d++) {
      const date = fmtDate(y, m, d);
      const dow = new Date(y, m, d).getDay();
      const isToday = (y === ty && m === tm && d === tdd);
      const locked = !currentUser || (date < cutoffStr && !isAdmin);
      const lockTitle = !currentUser ? '수정하려면 먼저 로그인하세요.' : '7일이 지난 일정은 관리자만 수정할 수 있습니다.';
      const cells = data.people.map((person, pi) => {
        const k = keyFor(date, person);
        const val = data.events[k] || '';
        const stamp = data.cellModified && data.cellModified[k];
        const who = data.cellModifiedBy && data.cellModifiedBy[k];
        let title = stamp ? `메모 · 수정 계정: ${who || '알 수 없음'} · 수정 날짜: ${formatModified(stamp)}` : '';
        if (locked) title = title ? `${title}\n${lockTitle}` : lockTitle;
        const tdCls = 'person-cell' + (stamp && val ? ' note-cell' : '');
        return `<td class="${tdCls}"><textarea class="entry${locked ? ' locked-entry' : ''}" data-date="${date}" data-pi="${pi}"${locked ? ' disabled' : ''}${title ? ` title="${escapeHtml(title)}"` : ''} aria-label="${date} ${escapeHtml(person)} 일정">\n${escapeHtml(val)}</textarea></td>`;
      }).join('');
      const mDate = data.modified && data.modified[date];
      const mUser = data.modifiedBy && data.modifiedBy[date];
      const modCell = `<td class="date-cell modified-cell${(mDate || histDates.has(date)) ? ' has-memo' : ''}" tabindex="0" data-date="${date}">` +
        (mDate ? `${escapeHtml(formatModified(mDate))}<br><strong>${escapeHtml(mUser || '이전 기록')}</strong>` : '—') + '</td>';
      const dateCls = 'date-cell ' + (dow === 0 ? 'weekend-sun' : dow === 6 ? 'weekend-sat' : '') + (isToday ? ' today' : '') + (HOLIDAYS[date] ? ' holiday' : '');
      const shift = shiftOf(y, m, d);
      const holidayName = HOLIDAYS[date] ? `<span class="holiday-name">${escapeHtml(HOLIDAYS[date])}</span>` : '';
      const shiftTag = shift.label === '휴무'
        ? '<span class="shift-tag shift-off">휴무</span>'
        : `<span class="shift-tag shift-${shift.label[0].toLowerCase()}">${shift.label}</span>`;
      const tr = document.createElement('tr');
      tr.dataset.date = date;
      if (isToday) tr.id = 'todayRow';
      tr.innerHTML = `<td class="${dateCls}"><span class="date-num">${d}일</span><span class="weekday">${WEEKDAYS[dow]}</span>${shiftTag}${holidayName}</td>${cells}${modCell}`;
      rows.push(tr);
    }
    return rows;
  }
  function attachMonth(idx) {
    if (loaded.has(idx)) return;
    try {
      const rows = buildMonthDayRows(ymOfIndex(idx).y, ymOfIndex(idx).m);
      loaded.add(idx); // 행 생성이 성공한 뒤에만 '붙음' 표시
      const frag = document.createDocumentFragment();
      rows.forEach(r => frag.appendChild(r));
      monthRowEls[idx].after(frag);
    } catch (err) {
      console.error(`attachMonth(${idx}) 실패:`, err);
      // 실패한 월 자리에 오류 표시행을 넣어 화면에서 바로 알 수 있게 한다
      const { y, m } = ymOfIndex(idx);
      const tr = document.createElement('tr');
      tr.innerHTML = `<td colspan="${data.people.length + 2}" style="color:#dc2626;padding:8px">이 달(${y}-${m + 1}) 렌더링 오류: ${escapeHtml(String(err && err.message || err))}</td>`;
      monthRowEls[idx].after(tr);
    }
  }
  function detachMonth(idx) {
    if (!loaded.has(idx)) return;
    const { y, m } = ymOfIndex(idx);
    // 편집 중인 textarea가 이 달에 있으면 떼지 않음
    const ae = document.activeElement;
    if (ae && ae.closest && ae.closest('textarea.entry') && ae.dataset.date && ae.dataset.date.startsWith(`${y}-${String(m+1).padStart(2,'0')}`)) return;
    // 저장 대기 중이면 먼저 확정 저장 (데이터 유실 방지)
    if (persistTimer) persist();

    const days = new Date(y, m+1, 0).getDate();
    let node = monthRowEls[idx].nextSibling;
    let n = 0;
    while (node && n < days) {
      const next = node.nextSibling;
      node.remove();
      node = next;
      n++;
    }
  }
  function ensureMonths() {
    try {
      const wrap = document.querySelector('.table-wrap');
      const wRect = wrap.getBoundingClientRect();
      const margin = 900;
      let min = -1, max = -1;
      // 월은 36개뿐이라 전체 검사가 가장 견고하다 (스크롤바 점프에도 안전)
      for (let i = 0; i < monthRowEls.length; i++) {
        const r = monthRowEls[i].getBoundingClientRect();
        if (r.bottom < wRect.top - margin || r.top > wRect.bottom + margin) continue;
        if (min < 0) min = i;
        max = i;
      }
      if (min < 0) return;
      for (let i = Math.max(0, min - 1); i <= Math.min(monthRowEls.length - 1, max + 1); i++) attachMonth(i);
      const keepMin = min - 2, keepMax = max + 2;
      for (const i of Array.from(loaded)) {
        if (i < keepMin || i > keepMax) detachMonth(i);
      }
    } catch (err) {
      console.error('ensureMonths 오류:', err);
    }
  }

  function render() {
    try {

    const prevTop = wrap.scrollTop;
    const header = document.getElementById('headerRow');

      data.people.map(p => `<th class="person-col">${escapeHtml(p)}</th>`).join('') +
      '<th class="date-col">마지막 수정일</th>';
    const cols = data.people.length + 2;
    const body = document.getElementById('bodyRows');
    const frag = document.createDocumentFragment();
    monthRowEls = [];
    loaded.clear();
    for (let y = RANGE_START; y <= RANGE_END; y++) {
      for (let m = 0; m < 12; m++) {
        const tr = document.createElement('tr');
        tr.className = 'month-row';
        tr.dataset.ym = `${y}-${m}`;
        tr.innerHTML = `<td colspan="${cols}"><span>${y}년 ${m+1}월</span></td>`;
        frag.appendChild(tr);
        monthRowEls.push(tr);
      }
    }
    body.innerHTML = '';
    body.appendChild(frag);
    const picker = document.getElementById('monthPicker');
    picker.min = `${RANGE_START}-01`; picker.max = `${RANGE_END}-12`;
    const now = new Date();
    const todayIdx = Math.min(MONTH_COUNT - 1, Math.max(0, indexOfMonth(now.getFullYear(), now.getMonth())));
    if (!rendered) {
      rendered = true;
      for (let i = Math.max(0, todayIdx - 2); i <= Math.min(MONTH_COUNT - 1, todayIdx + 2); i++) attachMonth(i);
      scrollToToday(false);
    } else {
      ensureMonths();
      wrap.scrollTop = prevTop;
    }
    updateCurrentMonth();
    } catch (err) {
      console.error('render() 실패:', err);

    }
  }
  let rendered = false;
  function scrollToEl(el, smooth) {
    const wrap = document.querySelector('.table-wrap');
    const head = wrap.querySelector('thead');
    const top = el.getBoundingClientRect().top - wrap.getBoundingClientRect().top + wrap.scrollTop - head.offsetHeight;
    if (smooth && wrap.scrollTo) wrap.scrollTo({ top: Math.max(0, top), behavior: 'smooth' });

  }
  function scrollToToday(smooth) {

    // 오늘 달이 DOM에서 떼어져 있을 수 있으므로 먼저 붙인다
    const idx = Math.min(MONTH_COUNT - 1, Math.max(0, indexOfMonth(now.getFullYear(), now.getMonth())));
    for (let i = Math.max(0, idx - 2); i <= Math.min(MONTH_COUNT - 1, idx + 2); i++) attachMonth(i);
    const todayStr = fmtDate(now.getFullYear(), now.getMonth(), now.getDate());
    const row = document.getElementById('bodyRows').querySelector(`tr[data-date="${todayStr}"]`);
    // 레이아웃이 완전히 잡힌 뒤 이동해야 정확한 위치로 간다 (rAF 2회 대기)
    requestAnimationFrame(() => requestAnimationFrame(() => {
      if (row && row.isConnected) { scrollToEl(row, !!smooth); return; }

    }));
  }
  function updateCurrentMonth() {
    if (!monthRowEls.length) return;
    const wrap = document.querySelector('.table-wrap');
    const limit = wrap.getBoundingClientRect().top + wrap.querySelector('thead').offsetHeight + 4;
    // 이분 탐색: 헤더 아래에 걸친 월 행 찾기
    let lo = 0, hi = monthRowEls.length - 1, cur = 0;
    while (lo <= hi) {
      const mid = (lo + hi) >> 1;
      if (monthRowEls[mid].getBoundingClientRect().top <= limit) { cur = mid; lo = mid + 1; }
      else hi = mid - 1;
    }
    const [y, m] = monthRowEls[cur].dataset.ym.split('-').map(Number);
    currentMonth = new Date(y, m, 1);
    document.getElementById('monthPicker').value = `${y}-${String(m+1).padStart(2,'0')}`;
  }
  function jumpToMonth(y, m, smooth) {
    const idx = indexOfMonth(y, m);
    if (idx < 0 || idx >= MONTH_COUNT) return;
    for (let i = Math.max(0, idx - 1); i <= Math.min(MONTH_COUNT - 1, idx + 1); i++) attachMonth(i);
    currentMonth = new Date(y, m, 1);
    document.getElementById('monthPicker').value = `${y}-${String(m+1).padStart(2,'0')}`;
    requestAnimationFrame(() => { ensureMonths(); scrollToEl(monthRowEls[idx], smooth); });
  }
  function formatModified(value) {
    if (!value) return '—';
    const d = new Date(value);
    if (Number.isNaN(d.getTime())) return '—';
    return d.toLocaleString('ko-KR', {
      year: 'numeric', month: '2-digit', day: '2-digit',
      hour: '2-digit', minute: '2-digit', hour12: false
    });
  }
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  document.getElementById('todayBtn').onclick = () => scrollToToday(true);
  document.getElementById('monthPicker').onchange = e => {
    if (!e.target.value) return;
    let [y, m] = e.target.value.split('-').map(Number);
    if (y < RANGE_START) { y = RANGE_START; m = 1; }
    if (y > RANGE_END) { y = RANGE_END; m = 12; }
    jumpToMonth(y, m - 1, false);
  };
  (() => {
    const wrap = document.querySelector('.table-wrap');
    let ticking = false;
    wrap.addEventListener('scroll', () => {
      if (ticking) return;
      ticking = true;
      requestAnimationFrame(() => { ticking = false; ensureMonths(); updateCurrentMonth(); });
    });
  })();

  // 셀 편집/메모는 표 전체에 이벤트 위임으로 처리(필요한 월만 DOM에 있으므로 가볍다)
  (() => {
    const body = document.getElementById('bodyRows');
    let memoAnchor = null;
    body.addEventListener('focusin', e => {
      const area = e.target.closest('textarea.entry');
      if (area) { area.dataset.init = area.value; return; }
      const c = e.target.closest('.modified-cell');
      if (c) showMemo(c, c.dataset.date);
    });
    body.addEventListener('focusout', e => {
      if (e.target.closest('.modified-cell')) hideMemo();
    });
    body.addEventListener('mouseover', e => {
      const c = e.target.closest('.modified-cell');
      if (c && c !== memoAnchor) { memoAnchor = c; showMemo(c, c.dataset.date); }
    });
    body.addEventListener('mouseout', e => {
      const c = e.target.closest('.modified-cell');
      if (c && !c.contains(e.relatedTarget)) { memoAnchor = null; hideMemo(); }
    });
    body.addEventListener('input', e => {
      const area = e.target.closest('textarea.entry');
      if (!area) return;
      const date = area.dataset.date;
      const person = data.people[Number(area.dataset.pi)];
      if (person === undefined) return;
      const k = keyFor(date, person);
      if (!currentUser || (isOlderThanSevenDays(date) && !isAdmin)) {
        area.value = data.events[k] || '';
        return;
      }
      if (area.value.trim()) data.events[k] = area.value;
      else delete data.events[k];
      if (!data.modified) data.modified = {};
      if (!data.modifiedBy) data.modifiedBy = {};
      if (!data.cellModified) data.cellModified = {};
      if (!data.cellModifiedBy) data.cellModifiedBy = {};
      const nowIso = new Date().toISOString();
      data.modified[date] = nowIso;
      data.modifiedBy[date] = currentUser;
      data.cellModified[k] = nowIso;
      data.cellModifiedBy[k] = currentUser;
      area.title = `메모 · 수정 계정: ${currentUser} · 수정 날짜: ${formatModified(nowIso)}`;
      area.parentElement.classList.toggle('note-cell', !!area.value);
      document.getElementById('saveStatus').textContent = '저장 대기 중…';
      persistSoon(400);
      const modifiedCell = area.closest('tr').querySelector('.modified-cell');
      if (modifiedCell) {
        modifiedCell.classList.add('has-memo');
        modifiedCell.innerHTML = `${escapeHtml(formatModified(nowIso))}<br><strong>${escapeHtml(currentUser)}</strong>`;
      }
    });
    // 기록은 입력이 끝나 값이 확정되는 change 이벤트에서 남깁니다.
    body.addEventListener('change', e => {
      const area = e.target.closest('textarea.entry');
      if (!area) return;
      const person = data.people[Number(area.dataset.pi)];
      if (person === undefined) return;
      const before = area.dataset.init || '';
      if (area.value !== before) {
        recordHistory(area.dataset.date, person, area.value, before);
        area.dataset.init = area.value;
        persist();
      }
    });
  })();

  document.getElementById('loginBtn').onclick = () => {
    const username = prompt('사용자 아이디를 입력하세요:');
    if (username === null) return;
    const password = prompt('비밀번호를 입력하세요:');
    if (password === null) return;
    const account = accounts.find(a => a.username === username.trim().normalize('NFC') && a.password === password);
    if (!account) { alert('아이디 또는 비밀번호가 올바르지 않습니다.'); return; }
    currentUser = account.username;
    sessionStorage.setItem('friendScheduleUser', currentUser);
    updateAdminUI();
    render();
    alert(`${account.role === 'admin' ? '관리자' : '사용자'}로 로그인했습니다.`);
  };
  document.getElementById('logoutBtn').onclick = () => {
    currentUser = '';
    sessionStorage.removeItem('friendScheduleUser');
    updateAdminUI();
    render();
  };

  const accountsModal = document.getElementById('accountsModal');
  document.getElementById('manageAccountsBtn').onclick = () => {
    if (!isAdmin) { alert('계정 관리는 관리자만 할 수 있습니다.'); return; }
    renderAccountsTable();
    accountsModal.style.display = 'flex';
  };
  document.getElementById('closeAccounts').onclick = () => accountsModal.style.display = 'none';
  accountsModal.addEventListener('click', e => { if (e.target === accountsModal) accountsModal.style.display='none'; });
  document.getElementById('accountForm').onsubmit = e => {
    e.preventDefault();
    if (!isAdmin) { alert('계정 관리는 관리자만 할 수 있습니다.'); return; }
    const username = document.getElementById('newUsername').value.trim().normalize('NFC');
    const password = document.getElementById('newPassword').value;
    const role = document.getElementById('newRole').value;
    if (!/^[가-힣a-zA-Z0-9._-]{2,40}$/.test(username)) {
      alert('아이디는 한글, 영문, 숫자, 점, 밑줄, 하이픈으로 2~40자 입력하세요.'); return;
    }
    if (password.length < 4) { alert('비밀번호는 4자 이상이어야 합니다.'); return; }
    if (accounts.some(a => a.username.toLowerCase() === username.toLowerCase())) {
      alert('이미 존재하는 아이디입니다.'); return;
    }
    accounts.push({username, password, role});
    saveAccounts();
    e.target.reset();
    renderAccountsTable();
    alert('계정을 등록했습니다.');
  };

  function renderAccountsTable() {
    const wrap = document.getElementById('accountsTableWrap');
    if (!isAdmin) { wrap.textContent = '관리자만 볼 수 있습니다.'; return; }
    wrap.innerHTML = '<table class="account-list"><thead><tr><th>아이디</th><th>권한</th><th>관리</th></tr></thead><tbody>' +
      accounts.map((a, i) => `<tr><td>${escapeHtml(a.username)}</td><td>${a.role === 'admin' ? '관리자' : '일반 사용자'}</td><td>` +
      (a.username === currentUser ? '현재 로그인' : `<button type="button" data-delete-account="${i}">삭제</button>`) +
      '</td></tr>').join('') + '</tbody></table>';
    wrap.querySelectorAll('[data-delete-account]').forEach(btn => {
      btn.onclick = () => {
        if (!isAdmin) return;
        const idx = Number(btn.getAttribute('data-delete-account'));
        if (accounts[idx] && confirm(`계정 "${accounts[idx].username}"을 삭제할까요?`)) {
          accounts.splice(idx, 1);
          saveAccounts();
          renderAccountsTable();
        }
      };
    });
  }

  const modal = document.getElementById('peopleModal');
  document.getElementById('managePeople').onclick = () => {
    if (!isAdmin) { alert('항목 관리는 관리자만 할 수 있습니다.'); return; }
    document.getElementById('peopleInput').value = data.people.join(', ');
    modal.style.display = 'flex';
  };
  document.getElementById('cancelPeople').onclick = () => modal.style.display = 'none';
  modal.addEventListener('click', e => { if (e.target === modal) modal.style.display='none'; });
  document.getElementById('savePeople').onclick = () => {
    const people = [...new Set(document.getElementById('peopleInput').value.split(',').map(s=>s.trim()).filter(Boolean))];
    if (!people.length) { alert('친구 이름을 한 명 이상 입력해 주세요.'); return; }
    // Keep events for retained people; remove events belonging to deleted columns.
    const keep = new Set(people);
    Object.keys(data.events).forEach(k => {
      const person = k.slice(k.indexOf('|')+1);
      if (!keep.has(person)) delete data.events[k];
    });
    data.people = people;
    persist(); render(); modal.style.display='none';
  };

  updateAdminUI();
  render();
})();
</script>
</body>
</html>
